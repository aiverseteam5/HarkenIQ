name: Tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    # A stall cap, not a budget: pytest-timeout names a hung test long before
    # this fires. Green runs take 12-29 min by runner (the same code ran 15.5
    # and 27.2), so 30 cancelled a healthy run, which keeps no log. Floor in
    # tests/unit/test_ci_hang_detection.py.
    timeout-minutes: 45
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - run: pip install -e services/site_manager -e services/central_command -e services/console
      - run: pytest --cov=harkeniq --cov-report=xml tests/

  # QA-030: the UIs are part of the product; CI must build them.
  ui-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Console UI
        run: cd console-ui && npm ci && npm run build
      - name: SM dashboard
        run: cd services/site_manager/ui && npm ci && npm run build

  # QA-030: the compose exit gate — boots the REAL stack and drives the
  # amendment-§8 scenario (register -> poll -> fault -> incident ->
  # propose -> approve -> audit verify). This is the gate whose absence
  # let releases ship green while the platform could not start.
  compose-gate:
    runs-on: ubuntu-latest
    # A stall cap, not a budget: the gate's own wait_for deadlines (8 min at
    # most) name a stuck wait long before this fires. Green runs take 27-29.6
    # min since TX-3, so 30 cancelled a healthy run at ec31a17, and a cancel
    # skips "Logs on failure". Floor in tests/unit/test_ci_hang_detection.py.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/e2e-compose-gate.sh
      - name: Logs on failure
        if: failure()
        run: cd deploy/full-stack && docker compose logs --tail 100
