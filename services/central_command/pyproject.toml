[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "harkeniq-central-command"
version = "0.1.0"
description = "HarkenIQ Central Command: per-tenant fleet intelligence, approval routing, usage reporting (L3)"
requires-python = ">=3.11"
license = {text = "Proprietary"}
dependencies = [
    "harkeniq",
    "fastapi>=0.111",
    "uvicorn>=0.30",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "pyyaml>=6.0",
    "grpcio>=1.60",
    "python-jose[cryptography]>=3.3",
    "httpx>=0.27",
]

[project.scripts]
harken-cc = "harkeniq_cc.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
