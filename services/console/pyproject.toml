[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "harkeniq-console"
version = "0.1.0"
description = "HarkenIQ Console: multi-tenant SaaS — tenancy, RBAC, billing, support, licensing (L4)"
requires-python = ">=3.11"
license = {text = "Proprietary"}
dependencies = [
    "harkeniq",
    "fastapi>=0.111",
    "uvicorn>=0.30",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "pyyaml>=6.0",
    "python-jose[cryptography]>=3.3",
    "python-keycloak>=4.0",
    "cryptography>=42.0",
    "httpx>=0.27",
    "python-multipart>=0.0.9",
    "stripe>=10.0",
    "razorpay>=1.4",
]

[project.scripts]
harken-console = "harkeniq_console.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
