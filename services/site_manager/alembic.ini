[alembic]
script_location = src/harkeniq_sm/db/migrations
prepend_sys_path = src
# DSN comes from HARKEN_SM_DSN (see migrations/env.py); this is a dev fallback.
sqlalchemy.url = postgresql+asyncpg://harkeniq:harkeniq@localhost:5432/harkeniq_sm

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
