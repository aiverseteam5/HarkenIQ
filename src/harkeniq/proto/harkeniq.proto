// HarkenIQ inter-service protocol (Doc 06 §10.2, spec 00 §7).
//
// AgentService: agent → Site Manager (agent-initiated, SM never dials nodes).
// SiteManagerService: Central Command → Site Manager (CC dials SM to poll
//   fleet state, route approvals, and collect usage snapshots).
syntax = "proto3";

package harkeniq.v1;

service AgentService {
  rpc ReportVerdict(VerdictReport) returns (VerdictAck);
  rpc Heartbeat(AgentHeartbeat) returns (HeartbeatAck);
  rpc RegisterAgent(AgentRegistration) returns (RegistrationAck);
  rpc ReportAction(ActionReport) returns (ActionAck);
  rpc PollActionDecisions(DecisionPoll) returns (DecisionList);
  // R3b-1 C7: SM pushes validated skills to agents
  rpc PushSkill(SkillDistribution) returns (SkillDistributionAck);
  // R5: SM->agent directed directives. Agents dial out; the SM cannot
  // dial agents, so SM-initiated work (firmware campaigns, marketplace
  // skill installs) is queued at the SM and delivered on this poll.
  rpc PollDirectives(DirectivePoll) returns (DirectiveList);
  rpc ReportDirectiveResult(DirectiveResult) returns (DirectiveAck);
}

// R5: directed directive (SM -> Agent via agent poll)
message DirectivePoll {
  string agent_id = 1;
}

message Directive {
  string directive_id = 1;
  string kind = 2;               // "action" | "skill_install"
  string action_type = 3;        // kind=action: ActionType value
  string params_json = 4;        // kind=action: action params
  string skill_id = 5;           // kind=skill_install
  string skill_version = 6;
  string yaml_content = 7;
  string tier = 8;
  string validation_state = 9;
  string issued_by = 10;         // e.g. "firmware-campaign:<id>" | "marketplace"
  // A1: who this directive runs for, and on what basis. `actor` is the
  // attribution key ("op-agent:<id>@v<n>" | "user:<email>"); it rides all
  // the way to the outcome record so evidence keeps its actor.
  string actor = 11;
  // A1: "human_approval" carries a named human's decision;
  // "autonomous_grant" carries only the tenant's autonomy contract, so the
  // node must still satisfy its lease rather than treating the directive as
  // pre-approved. Empty means legacy SM-authority work (firmware campaigns).
  string authorization = 12;
  string proposal_id = 13;       // A1: the CC proposal this settles
}

message DirectiveList {
  repeated Directive directives = 1;
}

message DirectiveResult {
  string agent_id = 1;
  string directive_id = 2;
  bool success = 3;
  string detail = 4;             // error message or outcome JSON
}

message DirectiveAck {
  bool accepted = 1;
}

// R3b-1 C7: Skill distribution (SM -> Agent)
message SkillDistribution {
  string skill_id = 1;
  string version = 2;
  string yaml_content = 3;           // full skill YAML
  string tier = 4;                   // core | vendor | community | auto_generated
  string validation_state = 5;       // tested | promoted
  string deployed_by = 6;
}

message SkillDistributionAck {
  bool accepted = 1;
  string reason = 2;                 // rejection reason if not accepted
}

message VerdictReport {
  string agent_id = 1;
  string sensor_id = 2;
  string skill_name = 3;
  string verdict = 4;          // HEALTHY, WARNING, CRITICAL, TRENDING, UNKNOWN
  string evidence_json = 5;
  int64 timestamp_unix = 6;
}

message VerdictAck {
  bool accepted = 1;
}

message AgentHeartbeat {
  string agent_id = 1;
  string agent_name = 2;
  string state = 3;            // OBSERVING, EVALUATING, etc.
  map<string, string> health_summary = 4;
  int64 timestamp_unix = 5;
  map<string, string> peer_status = 6;  // peer_id -> ALIVE|UNRESPONSIVE|UNKNOWN
}

message HeartbeatAck {
  bool accepted = 1;
  bytes authorization_lease = 2;  // R3a: signed lease blob (JSON + signature)
  int64 lease_expiry_unix = 3;    // R3a: convenience: lease expiry timestamp
}

message AgentRegistration {
  string agent_id = 1;
  string agent_name = 2;
  string vendor = 3;
  string model = 4;
  string service_tag = 5;
  string bmc_location_json = 6;   // BMC-reported location fields, may be empty
  repeated string peers = 7;      // configured peer adjacency, "host:port"
  bytes public_key_pem = 8;       // R3a: agent's Ed25519 public key
  string resource_profile = 9;    // R3a: "constrained" | "standard" | "performance"
  string firmware_json = 10;      // R4-2: firmware inventory [{component,name,version}]
  string device_class = 11;       // R6: "server" (default when absent) | "switch"
  // E1.3: the SITE-BOUND enrollment credential this device presents. The
  // Site Manager resolves it to exactly one site; there is deliberately
  // NO site_name field here, because a site an agent could name would be
  // a claim rather than a fact, and correlation, blast radius, error
  // budgets and (since E1.2) authority all resolve from it.
  string enrollment_token = 12;
  // Capability Registry: what this node's executor can ACTUALLY do.
  // {version, protocol, device_class, allow_list, implemented, effective,
  // reach_known}. The node is the only authoritative source -- everything
  // above it reflects this and may not declare a capability of its own.
  // Empty from a node predating the Registry, which reads UNKNOWN
  // upstream: never "capable", never "incapable".
  string capabilities_json = 13;
}

message RegistrationAck {
  bool accepted = 1;
  string site_name = 2;
  bytes sm_public_key_pem = 3;    // R3a: SM's Ed25519 public key (agent pins this)
  bytes agent_certificate = 4;    // R3a: SM's signature over agent identity
  map<string, bytes> peer_keys = 5;      // R3b-2: agent_id -> public_key_pem
  bytes peer_keys_signature = 6;         // R3b-2: SM signature over canonical(peer_keys)
  // E1.3: why a registration was refused. An agent that cannot prove its
  // site does not get one, and it must be able to say so in its logs
  // rather than retrying a malformed loop forever.
  string reason = 7;
}

message ActionReport {
  string agent_id = 1;
  string action_id = 2;
  string type = 3;                // IDENTIFY_LED, COLLECT_DIAGNOSTICS, ...
  string sensor_id = 4;
  string skill_name = 5;
  string verdict_severity = 6;
  string params_json = 7;
  string status = 8;              // PENDING, APPROVED, DENIED, COMPLETED, FAILED
  string proposed_at = 9;         // ISO-8601 UTC
  string outcome_json = 10;       // empty until terminal
}

message ActionAck {
  bool accepted = 1;
}

message DecisionPoll {
  string agent_id = 1;
}

message ActionDecision {
  string action_id = 1;
  string decision = 2;            // approved | denied
  string decided_by = 3;
  int64 decided_at_unix = 4;
}

message DecisionList {
  repeated ActionDecision decisions = 1;
}

// ---------------------------------------------------------------------------
// SiteManagerService: Central Command → Site Manager
// CC dials SM to register, poll fleet, route approvals, and collect usage.
// ---------------------------------------------------------------------------

service SiteManagerService {
  rpc RegisterSite(SiteRegistration) returns (SiteRegistrationAck);
  rpc GetFleetSnapshot(FleetSnapshotRequest) returns (FleetSnapshot);
  rpc RouteApproval(ApprovalRouteRequest) returns (ApprovalRouteAck);
  rpc GetUsageSnapshot(UsageSnapshotRequest) returns (UsageSnapshot);
  rpc PushPolicy(PolicyUpdate) returns (PolicyAck);
  // R5-2: CC pushes a marketplace skill to the site; the SM queues
  // skill_install directives its agents pick up on their next poll.
  rpc InstallSkill(SiteSkillInstall) returns (SiteSkillInstallAck);
  // A1: one-shot dispatch of a decided action to one device. The SM
  // queues it on the EXISTING directive transport; the node runs its
  // unchanged gate funnel. This verb delivers a decision, it does not
  // authorize one -- and it is the only CC->SM path an Operational
  // Agent's approved proposal takes.
  rpc DispatchAction(ActionDispatch) returns (ActionDispatchAck);
  // S6: READ-ONLY campaign wave planning. Central Command asks the site
  // that owns these devices how they must be batched. The handler
  // writes NOTHING -- it cannot mutate, dispatch or authorize -- which
  // is what lets "read-only" be proven by a table snapshot rather than
  // asserted. Fault-domain knowledge stays here; CC receives exact wave
  // membership and never a copy of the topology.
  rpc PlanCampaignWaves(CampaignPlanRequest) returns (CampaignPlan);
}

// A1: an approved (or contract-autonomous) action, dispatched CC -> SM.
message ActionDispatch {
  string tenant_id = 1;
  string site_id = 2;
  string device_agent_id = 3;    // fleet identity; SM resolves it to a device
  string action_type = 4;        // an ActionType the node executor knows
  string params_json = 5;
  string actor = 6;              // "op-agent:<id>@v<n>" | "user:<email>"
  string authorization = 7;      // "human_approval" | "autonomous_grant"
  string decided_by = 8;         // the named human; empty when autonomous
  string proposal_id = 9;        // the CC proposal this settles
}

message ActionDispatchAck {
  bool accepted = 1;
  string directive_id = 2;
  string reason = 3;             // never empty when accepted is false
}

// R5-2: marketplace skill install (CC -> SM)
message SiteSkillInstall {
  string tenant_id = 1;
  string site_id = 2;
  string skill_id = 3;
  string skill_version = 4;
  string yaml_content = 5;
  string tier = 6;
  string validation_state = 7;
  string issued_by = 8;          // e.g. "marketplace:<install_id>"
}

message SiteSkillInstallAck {
  bool accepted = 1;
  int32 queued = 2;              // directives queued (one per device)
  string reason = 3;
}

message SiteRegistration {
  string tenant_id = 1;
  string site_id = 2;
  string site_name = 3;
  string cc_endpoint = 4;
  string license_key_fingerprint = 5;
}

message SiteRegistrationAck {
  bool accepted = 1;
  string site_token = 2;
  string reason = 3;
}

message FleetSnapshotRequest {
  string tenant_id = 1;
  string site_id = 2;
}

message FleetDevice {
  string agent_id = 1;
  string agent_name = 2;
  string vendor = 3;
  string model = 4;
  string observation = 5;       // unobserved, observed, diagnosed
  string health = 6;            // ok, warning, critical, unknown
  string subsystems_json = 7;   // per-subsystem severity map
  int64 last_seen_unix = 8;
  string service_tag = 9;       // R4-2: warranty lookup key
  string inventory_json = 10;   // R4-2: {"firmware": [{component,name,version}]}
  string device_class = 11;     // R6: "server" (default when absent) | "switch"
  // Capability Registry: the node's own capability declaration, carried
  // verbatim from registration. Empty means the device has not declared,
  // which Central Command reports as unknown reach rather than none.
  string capabilities_json = 12;
}

message FleetIncident {
  string incident_id = 1;
  string kind = 2;
  string status = 3;
  string title = 4;
  string device_agent_id = 5;
  string subsystem = 6;
  int64 opened_at_unix = 7;
  // S4: the diagnosis rides the snapshot. Before this, the LLM explanation
  // stopped at the Site Manager, so the tenant surface could show that
  // something was wrong but never why. All additive tags; older agents and
  // SMs simply leave them empty.
  string parent_incident_id = 8;   // correlation parentage; "" for a parent
  double confidence = 9;           // SM's correlation confidence
  bool inferred = 10;              // domain was inferred, not confirmed (A1.1)
  string correlation_meta_json = 11;
  // The reasoning result stored on the incident: {provider, summary,
  // confidence, evidence_cited, reasoning_steps, suggested_action,
  // similar_past_incidents}. LLM-authored when provider == "llm", which is
  // why consumers must treat it as generated content, never instruction.
  string explanation_json = 12;
}

message FleetAction {
  string action_id = 1;
  string type = 2;
  string device_agent_id = 3;
  string severity = 4;
  string skill_name = 5;
  string status = 6;
  int64 proposed_at_unix = 7;
}

// R3b-3: outcome reporting for fleet learning (R-C1)
message FleetOutcome {
  string action_id = 1;
  string action_type = 2;
  string device_agent_id = 3;
  string outcome = 4;              // SUCCESS, PARTIAL, FAILURE, UNKNOWN, ROLLBACK
  bool fault_resolved = 5;
  string vendor = 6;
  string model = 7;
  int64 recorded_at_unix = 8;
  string actor = 9;                // A1: attribution, "" when unattributed
}

// QA-033 feedback half: SM-generated candidate skills ride the snapshot
// up to CC (CC pulls; no new trust direction) for the R-C1 learning loop.
message CandidateSkill {
  string skill_id = 1;
  string yaml_text = 2;
  string source_device = 3;
  string source_component = 4;
  string validation_state = 5;    // DRAFT, TESTED
  int64 generated_at_unix = 6;
  string warnings_json = 7;       // validation warnings, JSON array
  int32 dry_run_matches = 8;
}

// S5: live autonomy SAFETY STATE at the site. Before this, suppression
// and error-budget drop-back existed only inside the Site Manager and
// were reachable only through its site-token break-glass API, so neither
// the tenant operator nor any future agent could see that a class had
// been demoted automatically. Safety state is a governance INPUT, not
// page decoration: an actor must be able to evaluate the same state
// before it acts. All additive; an older SM leaves it empty and CC
// reports the site as not-reporting rather than as safe.
message SuppressedDomain {
  string domain_id = 1;
  string event_family = 2;
  string trigger_reason = 3;     // direct_dependency | statistical_threshold | ...
  int32 device_count = 4;
  int64 triggered_at_unix = 5;
  int64 all_clear_at_unix = 6;   // 0 when devices are not yet all healthy
}

message ActionErrorBudget {
  string action_type = 1;
  int32 success_count = 2;
  int32 failure_count = 3;
  int32 total_count = 4;
  double min_success_rate = 5;
  bool dropped_back = 6;         // autonomy withdrawn automatically (A2.2)
  int64 dropped_back_at_unix = 7;
}

message SiteBudgetRemaining {
  string action_type = 1;
  int32 remaining = 2;           // -1 = unlimited
}

message FleetSafetyState {
  bool reported = 1;             // false => this SM cannot vouch for state
  int64 as_of_unix = 2;
  bool sm_stop_switch = 3;       // site-local stop switch (SM break-glass)
  repeated SuppressedDomain suppressions = 4;
  repeated ActionErrorBudget error_budgets = 5;
  repeated SiteBudgetRemaining site_budgets = 6;
}

message FleetSnapshot {
  repeated FleetDevice devices = 1;
  repeated FleetIncident incidents = 2;
  repeated FleetAction pending_actions = 3;
  int64 snapshot_at_unix = 4;
  repeated FleetOutcome outcomes = 5;  // R3b-3: action outcomes for CC learning
  repeated CandidateSkill candidate_skills = 6;  // QA-033: R-C1 skill upflow
  FleetSafetyState safety = 7;         // S5: live autonomy safety state
  // E0.2: did the Site Manager resolve the requested site? An unresolved
  // site returns an EMPTY snapshot with a reason, never another site's
  // data and never the whole Site Manager's. Central Command must not
  // mistake this for "the site has no devices" and clear its cache.
  bool site_resolved = 8;
  string site_reason = 9;              // empty when resolved
}

message ApprovalRouteRequest {
  string action_id = 1;
  string decision = 2;           // approved | denied
  string decided_by = 3;
  string tenant_id = 4;
}

message ApprovalRouteAck {
  bool accepted = 1;
  bool delivered = 2;
  string reason = 3;
}

message UsageSnapshotRequest {
  string tenant_id = 1;
  string site_id = 2;
  string date = 3;               // YYYY-MM-DD
}

message UsageSnapshot {
  string tenant_id = 1;
  string site_id = 2;
  string date = 3;
  int32 node_count = 4;
  map<string, int32> agent_versions = 5;  // version -> count
}

message PolicyUpdate {
  string tenant_id = 1;
  string site_id = 2;
  string approval_policies_json = 3;
  string autonomy_budgets_json = 4;
  // QA-033 (R-C1): fleet patterns learned at CC, distributed to
  // scope-matched sites. JSON list of {pattern_id, pattern_type,
  // description, affected_scope, confidence, evidence, detected_at}.
  string learned_patterns_json = 5;
}

message PolicyAck {
  bool accepted = 1;
  string reason = 2;
}

// ---------------------------------------------------------------------------
// S6: campaign wave planning (read-only)
// ---------------------------------------------------------------------------

message CampaignPlanRequest {
  string tenant_id = 1;
  string site_id = 2;                    // CC's site id (E0.2 binding)
  string campaign_id = 3;
  int32 campaign_version = 4;
  string action_type = 5;
  // The eligible set, SORTED by the caller. Ordering is part of the
  // determinism contract: the same request must yield the same plan_hash.
  repeated string device_agent_ids = 6;
  int32 max_wave_size = 7;
}

message CampaignPlanWave {
  int32 wave_index = 1;
  repeated string device_agent_ids = 2;  // exact membership, sorted
  // How many DISTINCT fault domains this wave spans. A count, never the
  // domain identities: Central Command must not become a second
  // representation of the site's topology.
  int32 domain_span = 3;
}

message CampaignPlan {
  bool planned = 1;
  string reason = 2;                     // why not, when planned = false
  string site_id = 3;
  string campaign_id = 4;
  int32 campaign_version = 5;
  string action_type = 6;
  repeated CampaignPlanWave waves = 7;
  // Requested but not resolvable at this site. Surfaced, never silently
  // dropped -- a device that vanished from a plan with no reason is
  // indistinguishable from one nobody selected.
  repeated string unplannable_device_ids = 8;
  // sha256 over canonical_json of the plan content. Approval binds to
  // this; any material change produces a different hash, which is what
  // makes a stale approval structurally unable to address the new plan.
  string plan_hash = 9;
  int64 generated_at_unix = 10;
  string separation_rule = 11;           // human-readable planner basis
}
